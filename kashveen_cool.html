<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashveen-MyPortfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #927933;
            overflow-x: hidden; /* Prevents horizontal scroll from floating bubbles */
        }

        /* --- Bubble Background Animation --- */
        .bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1; /* Keeps bubbles behind all content */
        }

        .bubble {
            position: absolute;
            bottom: -150px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: rise 10s infinite linear;
        }

        /* Randomizing sizes, positions, and speeds for a natural effect */
        .bubble:nth-child(1) { width: 40px; height: 40px; left: 10%; animation-duration: 8s; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 20px; height: 20px; left: 20%; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 60px; height: 60px; left: 35%; animation-duration: 7s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 30px; height: 30px; left: 50%; animation-duration: 10s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 50px; height: 50px; left: 65%; animation-duration: 9s; animation-delay: 3s; }
        .bubble:nth-child(6) { width: 25px; height: 25px; left: 80%; animation-duration: 11s; animation-delay: 5s; }
        .bubble:nth-child(7) { width: 45px; height: 45px; left: 90%; animation-duration: 13s; animation-delay: 2s; }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.3;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-110vh) scale(1.1);
                opacity: 0;
            }
        }
        /* ---------------------------------- */

        header {
            background-color: #27aa39;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #9a2faf;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        nav a:hover {
            color: #261392;
        }

        main {
            padding: 20px;
            text-align: center;
        }

        footer {
            background-color: #0078D7;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        button {
            padding: 10px 20px;
            background-color: #0078D7;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #005fa3;
        }
    </style>
</head>
<body>

    <div class="bubble-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <header>
        <h1>Welcome To My Portfolio</h1>
        <p>A simple HTML website about me</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <h2>Hello!</h2>
        <p>This is a basic website that tells about me.</p>
        <button onclick="showMessage()">Click Me</button>
    </main>

    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

    <script>
        function showMessage() {
            alert("Thanks for visiting my website! Love me all!");
        }
    </script>

</body>
</html>
