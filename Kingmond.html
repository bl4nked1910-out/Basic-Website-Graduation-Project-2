<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY PORTFOLIO</title>

<style>


:root {
  --bg: #0f0f14;
  --accent: #08e249;
  --accent2: #8affc1;
  --text: #00ff1a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  scroll-behavior: smooth;
  background-image: url('https://wallpapers.com/images/high/anime-gaming-oo37ojjq85z45049.webp');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
}

/* NAV */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  background: rgba(15,15,20,0.7);
  backdrop-filter: blur(10px);
}

nav a {
  color: var(--text);
  text-decoration: none;
  margin-left: 20px;
  font-size: 0.9rem;
}

nav a:hover {
  color: var(--accent);
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
}

.hero h1 {
  font-family: 'RocknRoll One', sans-serif;
  font-size: 3rem;
  color: var(--accent);
}

.hero p {
  margin-top: 10px;
  font-size: 1rem;
  opacity: 0.8;
}

.btn {
  margin-top: 25px;
  padding: 10px 20px;
  border: 1px solid var(--accent);
  color: var(--accent);
  text-decoration: none;
  border-radius: 20px;
  transition: 0.3s;
}

.btn:hover {
  background: var(--accent);
  color: #000;
}

/* ABOUT */
.section {
  padding: 80px 40px;
  max-width: 900px;
  margin: auto;
}

.section h2 {
  font-size: 1.5rem;
  margin-bottom: 20px;
  color: var(--accent2);
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

.gallery img {
  width: 100%;
  border-radius: 12px;
  transition: 0.3s;
  filter: grayscale(40%);
}

.gallery img:hover {
  transform: scale(1.05);
  filter: grayscale(0%);
}

/* FOOTER */
footer {
  text-align: center;
  padding: 30px;
  font-size: 0.8rem;
  opacity: 0.6;
}

.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* PARALLAX LAYERS */
.hero::before {
  content: "";
  position: absolute;
  width: 120%;
  height: 120%;
  top: -10%;
  left: -10%;
  background: url('https://wallpapers.com/images/high/anime-gaming-oo37ojjq85z45049.webp/1200/800?blur=2') center/cover no-repeat;
  transform: translateY(0);
  z-index: -2;
  opacity: 0.25;
}

</style>
</head>

<body>

<nav>
  <div>MY PORTFOLIO</div>
  <div>
    <a href="#about">about</a>
    <a href="#gallery">gallery</a>
  </div>
</nav>

<section class="hero">
  <h1>Hi, i'm Kingmond</h1>
  <p>I'm 13 years old this year and I love to play game</p>
  <a href="#gallery" class="btn">Get To Know About My hobbies</a>
</section>

<section id="about" class="section">
  <h2>About me</h2>
  <p>
     MY name is CHONG KINGMOND,I am 13 years old this year and my hobbies is playing basketball, football and badminton
  </p>
</section>

<section id="gallery" class="section">
  <h2>My Hobby Inspiration2</h2>
  <div class="gallery">
    <img src="https://img.magnific.com/free-photo/orange-basketball-white_23-2152015636.jpg?semt=ais_hybrid&w=740&q=80" style="width: 100%; height: auto;" alt="Descriptive text">
    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/b/b2/Brawl_Stars_logo_2025.svg/500px-Brawl_Stars_logo_2025.svg.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" style="width: 100%; height: auto;" alt="Descriptive text">
    <img src="https://contents.mediadecathlon.com/p2919897/k$03f19091f1bd0835734253d986bd7085/beach-volleyball-size-5-bv100-classic-coloured-kipsta-8816710.jpg?f=1920x0&format=auto" style="width: 100%; height: auto;" alt="Descriptive text">
    <img src="https://cdn.sanity.io/images/2hlolhb1/production/028ac175a6e0bb01cb3b157a389c93d9e76b81b9-8116x5411.jpg?rect=2116,1943,4239,3179&w=3840&h=2880&q=75&auto=format" style="width: 100%; height: auto;" alt="Descriptive text">
    <img src="https://img.olympics.com/images/image/private/t_twitter_share_thumb/f_auto/primary/ybf4bxkp9jbccxxxg3kx" style="width: 100%; height: auto;" alt="Descriptive text">
  </div>
</section>

<footer>
  Legendary Creator
</footer>

</body>

<script>
window.addEventListener("scroll", () => {
  const scrollY = window.scrollY;
  const hero = document.querySelector(".hero");

  hero.style.setProperty("--scroll", scrollY);

  hero.style.backgroundPositionY = scrollY * 0.3 + "px";
});
</script>
</html>
